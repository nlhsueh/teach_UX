<header>UX for AI: Human-Centered AI System Design</header>
<h2 id="ai-%E7%B3%BB%E7%B5%B1%E8%88%87%E6%87%89%E7%94%A8%E7%9A%84%E5%85%A8%E9%9D%A2%E6%99%AE%E5%8F%8A">AI 系統與應用的全面普及</h2>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%92%A1-%E4%BB%80%E9%BA%BC%E6%98%AF-ai-%E7%B3%BB%E7%B5%B1-ai-systems"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 什麼是 AI 系統 (AI Systems)？</h3>
<ul>
<li data-marpit-fragment="1"><strong>非單純的大語言模型 (LLM)</strong> ：它不是叫使用者去跟 ChatGPT/Claude 網頁版聊天，而是將 AI 能力深度封裝於工作流中的 <strong>應用產品</strong> 。</li>
<li data-marpit-fragment="2"><strong>以人為本的系統整合</strong> ：AI 扮演背景運算、自動完成、智能建議或自主代理人 (Agent) 的角色，提供直覺且自然的互動介面。</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%8E%AF-ai-%E7%B3%BB%E7%B5%B1%E7%9A%84%E9%97%9C%E9%8D%B5%E6%87%89%E7%94%A8%E7%AF%84%E7%96%87"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3af.svg" data-marp-twemoji=""/> AI 系統的關鍵應用範疇</h3>
<ul>
<li data-marpit-fragment="3"><strong>智慧輔助與自動完成 (Co-piloting)</strong> ：在開發或創作中給予行內建議。</li>
<li data-marpit-fragment="4"><strong>上下文關聯操作 (Contextual Actions)</strong> ：根據使用者目前選取的內容主動提供功能。</li>
<li data-marpit-fragment="5"><strong>多模態智慧轉換 (Multimodal)</strong> ：將文字、圖像、語音、程式碼等多種媒介進行無縫轉譯。</li>
</ul>
</div>
</div>

<div class="card" style="font-size: 21px;">
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4bb.svg" data-marp-twemoji=""/> <strong>GitHub Copilot</strong> ：整合於 IDE 的 AI 結對程式員。透過灰色預測字元 (Ghost Text) 在行內即時推薦程式碼，極大提升開發效率。</li>

<li data-marpit-fragment="3"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4dd.svg" data-marp-twemoji=""/> <strong>Notion AI</strong> ：將 AI 融入文件編輯器的右鍵/斜線選單。提供選取文字一鍵潤飾、翻譯、總結或擴寫的情境功能。</li>
</ul>

<div class="card" style="font-size: 21px;">
<ul>

<header>UX for AI: Human-Centered AI System Design</header>
<h2 id="slide-01-ai-and-ns01-%E7%B3%BB%E7%B5%B1%E7%8B%80%E6%85%8B%E8%83%BD%E8%A6%8B%E5%BA%A6---ux-%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95">Slide 01: AI and NS01 (系統狀態能見度) - UX 設計心法</h2>
<blockquote>
<p><em>“系統應在合理時間內，透過適當的反饋，隨時讓使用者掌握目前狀態。”</em></p>
</blockquote>
<div class="two-columns-73">
<div class="card" style="font-size: 21px;">
<h3 id="%F0%9F%92%A1-ai-%E7%94%A2%E5%93%81%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95-ux-for-ai"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> AI 產品設計心法 (UX for AI)</h3>
<ul>
<li data-marpit-fragment="1"><strong>緩解 AI 的「思考延遲（Latency）」：</strong>
<ul>
<li data-marpit-fragment="2">避免只用靜態的「Loading...」，改用 <strong>打字機效果（Streaming）</strong> 即時輸出內容。</li>
<li data-marpit-fragment="3">引入 <strong>展開式「思考步驟（Thinking Steps）」</strong> （如 DeepSeek/O1 的 CoT 摺疊面板），讓使用者清楚 AI 正在進行「聯網搜尋」、「閱讀文件」或「執行程式碼」。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>多步驟 AI 工作流（Multi-Agent Workflows）：</strong>
<ul>
<li data-marpit-fragment="5">使用狀態節點圖（Node Graph）或微步進器，向使用者顯示目前 AI 助理正在進行 5 個步驟中的第 2 步（例如：生成草稿 → 翻譯 → 校對）。</li>
</ul>
</li>
</ul>
</div>
<div class="card" style="font-size: 21px;">
<h3 id="%F0%9F%94%8D-%E7%9C%9F%E5%AF%A6%E7%B3%BB%E7%B5%B1%E6%87%89%E7%94%A8%E6%A1%88%E4%BE%8B"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f50d.svg" data-marp-twemoji=""/> 真實系統應用案例</h3>
<ul>
<li data-marpit-fragment="6"><strong>DeepSeek-R1 / OpenAI o1</strong> 思考摺疊面板。</li>
<li data-marpit-fragment="7">AI 進行推理時，介面會呈現一個名為 <code>Thought</code> 或 <code>Thinking</code> 的摺疊區塊，即時顯示其思考步驟（ <strong>Chain of Thought, CoT</strong> ）。使用者可展開查看詳細邏輯，以緩解等待焦慮。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>

<header>UX for AI: Human-Centered AI System Design</header>
<h2 id="slide-01-ai-and-ns01-%E7%B3%BB%E7%B5%B1%E7%8B%80%E6%85%8B%E8%83%BD%E8%A6%8B%E5%BA%A6---%E5%BB%BA%E8%AD%B0-prompt">Slide 01: AI and NS01 (系統狀態能見度) - 建議 Prompt</h2>
<div class="prompt-box" style="font-size: 19px;">
<h3 id="%F0%9F%93%9D-%E5%BB%BA%E8%AD%B0-prompt-ai-for-ux"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 建議 Prompt (AI for UX)</h3>
<blockquote>
<p>「我正在開發一個 [AI 簡報生成功能]。當使用者輸入主題後，AI 需要進行：資料檢索、大綱生成、內容撰寫、投影片排版等 4 個耗時步驟。<br />
請為我設計符合 <strong>Visibility of System Status</strong> 原則的 UI 反饋機制：</p>
<ol>
<li>請規劃每一個步驟的狀態文案（如：正在尋找資料... 預估剩餘 10 秒）。</li>
<li>請提供前端 React 或 Vue 的狀態變數（Variables，如 <code>isSearching</code>, <code>progressPercent</code>）之設計邏輯，讓工程師能直接套用。」</li>
</ol>
</blockquote>

<header>UX for AI: Human-Centered AI System Design</header>
<h2 id="slide-02-ai-and-ns02-%E7%9C%9F%E5%AF%A6%E4%B8%96%E7%95%8C%E8%88%87%E7%B3%BB%E7%B5%B1%E7%9A%84%E5%B0%8D%E6%87%89---ux-%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95">Slide 02: AI and NS02 (真實世界與系統的對應) - UX 設計心法</h2>
<blockquote>
<p><em>“系統應說使用者的日常語言，而非工程師的技術術語，並遵循真實世界的邏輯習慣。”</em></p>
</blockquote>
<div class="two-columns-73">
<div class="card" style="font-size: 21px;">
<h3 id="%F0%9F%92%A1-ai-%E7%94%A2%E5%93%81%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95-ux-for-ai-1"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> AI 產品設計心法 (UX for AI)</h3>
<ul>
<li data-marpit-fragment="1"><strong>將「模型參數」具象化：</strong>
<ul>
<li data-marpit-fragment="2">避免在一般介面直接呈現 Temperature、Top_p、Token Limit 等大模型底層術語。</li>
<li data-marpit-fragment="3">將技術參數轉化為直覺的「擬真滑桿」或「單選按鈕」（例如：將 Temperature 轉化為「<img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 創意表現：保守 → 豐富想像力」）。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>擬真隱喻與控制：</strong>
<ul>
<li data-marpit-fragment="5">使用「副駕駛（Copilot）」或「助理（Assistant）」的擬人化視覺隱喻，讓使用者知道它可以對話，而非面對一個冰冷的 Command Line。</li>
</ul>
</li>
</ul>
</div>
<div class="card" style="font-size: 21px;">
<h3 id="%F0%9F%94%8D-%E7%9C%9F%E5%AF%A6%E7%B3%BB%E7%B5%B1%E6%87%89%E7%94%A8%E6%A1%88%E4%BE%8B-1"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f50d.svg" data-marp-twemoji=""/> 真實系統應用案例</h3>
<ul>
<li data-marpit-fragment="6"><strong>Notion AI</strong> 的「變更語氣」下拉選單。</li>
<li data-marpit-fragment="7">後台模型參數如 <code>Temperature</code> （溫度）對大眾而言過於技術化。 Notion AI 將其轉化為直覺的「語氣調整」（例如：專業、日常、幽默、友善），更貼近使用者的日常語音習慣。</li>
</ul>
</div>
</div>

<blockquote>
<p>「我們正在為非技術背景的主管開發一個 [AI 行銷文案助手]。大模型後台有 <code>Temperature</code>、<code>Presence Penalty</code>、<code>Frequency Penalty</code> 等參數需要調整。<br />

<header>UX for AI: Human-Centered AI System Design</header>
<h2 id="slide-03-ai-and-ns03-%E4%BD%BF%E7%94%A8%E8%80%85%E6%8E%A7%E5%88%B6%E8%88%87%E8%87%AA%E7%94%B1---ux-%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95">Slide 03: AI and NS03 (使用者控制與自由) - UX 設計心法</h2>
<blockquote>
<p><em>“使用者常會誤觸功能，系統必須提供明確的『緊急出口』與隨時能復原的 Undo/Redo 控制權。”</em></p>
</blockquote>
<div class="two-columns-64">
<div class="card" style="font-size: 21px;">
<h3 id="%F0%9F%92%A1-ai-%E7%94%A2%E5%93%81%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95-ux-for-ai-2"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> AI 產品設計心法 (UX for AI)</h3>
<ul>
<li data-marpit-fragment="1"><strong>對抗 AI 的不確定性：</strong>
<ul>
<li data-marpit-fragment="2">提供隨時 <strong>「中斷生成（Stop Generating）」</strong> 的按鈕，防止 AI 輸出過長或失控的內容。</li>
<li data-marpit-fragment="3">引入 <strong>「版本輪播（Version Carousel）」</strong> ：在 AI 生成的結果旁，提供 1/3 的左右切換鍵，允許使用者對比並找回前幾次生成的滿意版本。</li>
<li data-marpit-fragment="4"><strong>Prompt 局部編輯</strong> ：使用者可以編輯對話歷史中的任何一則 Prompt，點擊後系統自動在該節點分支「重新生成」，不破壞原始對話。</li>
</ul>
</li>
</ul>
</div>
<div class="card" style="font-size: 21px;">
<h3 id="%F0%9F%94%8D-%E7%9C%9F%E5%AF%A6%E7%B3%BB%E7%B5%B1%E6%87%89%E7%94%A8%E6%A1%88%E4%BE%8B-2"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f50d.svg" data-marp-twemoji=""/> 真實系統應用案例</h3>
<ul>
<li data-marpit-fragment="5"><strong>ChatGPT / Claude</strong> 的「中斷生成」與「歷史版本切換」。</li>
<li data-marpit-fragment="6">當 AI 輸出的內容偏離預期或陷入無限迴圈時，使用者可隨時點擊「■ 中斷生成 (Stop Generating)」按鈕；生成完成後，若對答案不滿意，可使用 <code>1/2</code> 左右按鈕切換並對比歷史生成的不同版本。</li>
</ul>
</div>
</div>

<h2 id="slide-03-ai-and-ns03-%E4%BD%BF%E7%94%A8%E8%80%85%E6%8E%A7%E5%88%B6%E8%88%87%E8%87%AA%E7%94%B1---%E5%BB%BA%E8%AD%B0-prompt">Slide 03: AI and NS03 (使用者控制與自由) - 建議 Prompt</h2>
<div class="prompt-box" style="font-size: 19px;">
<h3 id="%F0%9F%93%9D-%E5%BB%BA%E8%AD%B0-prompt-ai-for-ux-2"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 建議 Prompt (AI for UX)</h3>
<blockquote>
<p>「當我們的 [AI 程式碼生成器] 在輸出一段 50 行的程式碼時，使用者發現方向錯了，或者大模型陷入了無限循環。<br />
請基於 <strong>User Control and Freedom</strong> 原則，為我設計介面的控制流程：</p>
<ol>
<li>設計一個隨時『中斷生成』的 UI 機制（包含視覺提示）。</li>
<li>當使用者發現 AI 修改了他們原本的程式碼，應如何設計『一鍵還原 (Revert)』或『顯示差異對照 (Diff View)』的選項，以降低修改錯誤的焦慮。」</li>
</ol>
</blockquote>

<header>UX for AI: Human-Centered AI System Design</header>
<h2 id="slide-04-ai-and-ns04-%E4%B8%80%E8%87%B4%E6%80%A7%E8%88%87%E6%A8%99%E6%BA%96---ux-%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95">Slide 04: AI and NS04 (一致性與標準) - UX 設計心法</h2>
<blockquote>
<p><em>“使用者不應懷疑不同的詞彙、操作或位置是否代表同一件事。需遵循平台既有慣例。”</em></p>
</blockquote>
<div class="two-columns-73">
<div class="card" style="font-size: 21px;">
<h3 id="%F0%9F%92%A1-ai-%E7%94%A2%E5%93%81%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95-ux-for-ai-3"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> AI 產品設計心法 (UX for AI)</h3>
<ul>
<li data-marpit-fragment="1"><strong>建立 AI 互動的「新標準」：</strong>
<ul>
<li data-marpit-fragment="2">雖然 AI 介面日新月異，但已建立起業界標準（Standards），設計時必須遵循：
<ul>
<li data-marpit-fragment="3"><code>Cmd + K</code> 或 <code>Ctrl + K</code> 喚醒全域 AI 搜尋/指令面板。</li>
<li data-marpit-fragment="4">輸入框按 <code>Enter</code> 為發送，<code>Shift + Enter</code> 為換行。</li>
<li data-marpit-fragment="5">每一則 AI 回覆的底部必備「複製（Copy）」與「重新生成（Regenerate）」圖標。</li>
</ul>
</li>
</ul>
</li>
<li data-marpit-fragment="6"><strong>反饋機制的一致性：</strong> 全站統一使用「<img class="emoji" draggable="false" alt="👍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f44d.svg" data-marp-twemoji=""/> / <img class="emoji" draggable="false" alt="👎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f44e.svg" data-marp-twemoji=""/>」或「星星評分」收集使用者對 AI 回覆的滿意度，不可隨意更換評分標準。</li>
</ul>
</div>
<div class="card" style="font-size: 21px;">
<h3 id="%F0%9F%94%8D-%E7%9C%9F%E5%AF%A6%E7%B3%BB%E7%B5%B1%E6%87%89%E7%94%A8%E6%A1%88%E4%BE%8B-3"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f50d.svg" data-marp-twemoji=""/> 真實系統應用案例</h3>
<ul>
<li data-marpit-fragment="7"><strong>Cursor / ChatGPT</strong> 的標準輸入框按鍵設計。</li>
<li data-marpit-fragment="8">全網 AI 助手已形成通用的操作標準：使用 <code>Enter</code> 鍵發送、 <code>Shift + Enter</code> 鍵進行換行；回覆內容底部一致使用「<img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4cb.svg" data-marp-twemoji=""/> 複製」與「<img class="emoji" draggable="false" alt="👍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f44d.svg" data-marp-twemoji=""/>/<img class="emoji" draggable="false" alt="👎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f44e.svg" data-marp-twemoji=""/> 回饋評分」圖標。</li>
</ul>

<header>UX for AI: Human-Centered AI System Design</header>
<h2 id="slide-04-ai-and-ns04-%E4%B8%80%E8%87%B4%E6%80%A7%E8%88%87%E6%A8%99%E6%BA%96---%E5%BB%BA%E8%AD%B0-prompt">Slide 04: AI and NS04 (一致性與標準) - 建議 Prompt</h2>
<div class="prompt-box" style="font-size: 19px;">
<h3 id="%F0%9F%93%9D-%E5%BB%BA%E8%AD%B0-prompt-ai-for-ux-3"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 建議 Prompt (AI for UX)</h3>
<blockquote>
<p>「我們正在為企業內部多個不同業務系統（如：HR 系統、財務系統）設計內嵌的 [AI 對話助理]。<br />

<header>UX for AI: Human-Centered AI System Design</header>
<h2 id="slide-05-ai-and-ns05-%E9%8C%AF%E8%AA%A4%E9%A0%90%E9%98%B2---ux-%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95">Slide 05: AI and NS05 (錯誤預防) - UX 設計心法</h2>
<blockquote>
<p><em>“比起提供好用的錯誤訊息，更好的設計是防範錯誤於未然（預防不合理的輸入或操作）。”</em></p>
</blockquote>
<div class="two-columns-64">
<div class="card" style="font-size: 21px;">
<h3 id="%F0%9F%92%A1-ai-%E7%94%A2%E5%93%81%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95-ux-for-ai-4"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> AI 產品設計心法 (UX for AI)</h3>
<ul>
<li data-marpit-fragment="1"><strong>預防「糟糕輸入導致垃圾輸出（Garbage in, Garbage out）」：</strong>
<ul>
<li data-marpit-fragment="2">一般使用者極度不擅長寫 Prompt。提供 <strong>「提示詞晶片（Prompt Chips/Suggestions）」</strong> 或模板（Templates），點擊即代入標準提示。</li>
<li data-marpit-fragment="3">輸入框中預設豐富的 <strong>Placeholder 提示字</strong> （例如：試試看輸入：『幫我把這段報告翻譯成日文...』），引導正確輸入。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>智慧 Prompt 預檢（Pre-flight Check）：</strong> 當檢測到使用者上傳了不支援的檔案格式，或輸入的 Prompt 語意含混時，在發送前以「Inline Suggestion」主動提醒。</li>
</ul>
</div>
<div class="card" style="font-size: 21px;">
<h3 id="%F0%9F%94%8D-%E7%9C%9F%E5%AF%A6%E7%B3%BB%E7%B5%B1%E6%87%89%E7%94%A8%E6%A1%88%E4%BE%8B-4"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f50d.svg" data-marp-twemoji=""/> 真實系統應用案例</h3>
<ul>
<li data-marpit-fragment="5"><strong>ChatGPT / Claude</strong> 的「提示字晶片 (Prompt Chips)」與「預設預檢」。</li>
<li data-marpit-fragment="6">一般使用者不擅長撰寫 Prompt 。輸入框下方預設提供常用範本的晶片（例如「分析數據」、「撰寫郵件」），點擊即可套用；且當上傳不支援的檔案格式時，發送按鈕會轉為禁用狀態，防止無效點擊。</li>
</ul>
</div>
</div>

<header>UX for AI: Human-Centered AI System Design</header>
<h2 id="slide-05-ai-and-ns05-%E9%8C%AF%E8%AA%A4%E9%A0%90%E9%98%B2---%E5%BB%BA%E8%AD%B0-prompt">Slide 05: AI and NS05 (錯誤預防) - 建議 Prompt</h2>
<div class="prompt-box" style="font-size: 19px;">
<h3 id="%F0%9F%93%9D-%E5%BB%BA%E8%AD%B0-prompt-ai-for-ux-4"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 建議 Prompt (AI for UX)</h3>
<blockquote>
<p>「使用者在使用我們的 [AI 圖表分析助理] 時，常常上傳了不支援的檔案格式（例如上傳了 <code>.rar</code> 壓縮檔，但系統僅支援 <code>.csv</code> 試算表），或者直接輸入了不具實質內容的 Prompt（如『哈囉』、『幫我做圖』）。<br />
請基於 <strong>Error Prevention</strong> 原則，幫我設計一套防範機制的互動邏輯：</p>
<ol>
<li>在使用者點選發送前，如何進行檔案與文字的智慧預檢，並給予就地提示？</li>
<li>設計一個 Prompt 引導輸入區，利用 Prompt Chips 與選單功能限制使用者的不當輸入。」</li>
</ol>
</blockquote>

<header>UX for AI: Human-Centered AI System Design</header>
<h2 id="slide-06-ai-and-ns06-%E6%98%93%E6%96%BC%E8%AD%98%E5%88%A5%E8%80%8C%E9%9D%9E%E6%86%91%E7%A9%BA%E8%A8%98%E6%86%B6---ux-%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95">Slide 06: AI and NS06 (易於識別，而非憑空記憶) - UX 設計心法</h2>
<blockquote>
<p><em>“讓資訊、動作與選項保持可見，降低使用者的記憶負荷。使用者不應背誦指令。”</em></p>
</blockquote>
<div class="two-columns-73">
<div class="card" style="font-size: 21px;">
<h3 id="%F0%9F%92%A1-ai-%E7%94%A2%E5%93%81%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95-ux-for-ai-5"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> AI 產品設計心法 (UX for AI)</h3>
<ul>
<li data-marpit-fragment="1"><strong>告別「萬惡的空白輸入框（Empty State Fear）」：</strong>
<ul>
<li data-marpit-fragment="2">不要只給使用者一個空無一物的對話框，這會帶來極高的認知摩擦（Cognitive Friction）。</li>
<li data-marpit-fragment="3">畫面上應常駐 <strong>「最近使用的 Agent 助理」</strong> 、 <strong>「常用 Prompt 歷史紀錄」</strong> 、或一鍵調用最近編輯的檔案。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>情境選單（Contextual Actions）：</strong>
<ul>
<li data-marpit-fragment="5">當使用者在網頁上反白選取一段文字時，立刻在游標旁彈出「AI 快捷懸浮球」（如：翻譯、總結、潤飾），讓使用者「看得到就能點」，不需手動複製貼上。</li>
</ul>
</li>
</ul>
</div>
<div class="card" style="font-size: 21px;">
<h3 id="%F0%9F%94%8D-%E7%9C%9F%E5%AF%A6%E7%B3%BB%E7%B5%B1%E6%87%89%E7%94%A8%E6%A1%88%E4%BE%8B-5"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f50d.svg" data-marp-twemoji=""/> 真實系統應用案例</h3>
<ul>
<li data-marpit-fragment="6"><strong>Notion AI</strong> 的「文字選取 AI 懸浮選單」。</li>
<li data-marpit-fragment="7">當使用者在頁面中反白選取任何文字時，系統會自動在游標旁彈出懸浮工具列，提供翻譯、摘要、重寫等 AI 情境按鈕。使用者「看見即可點選」，不需要回憶 <code>/</code> 指令或複製貼上。</li>
</ul>
</div>
</div>

<header>UX for AI: Human-Centered AI System Design</header>
<h2 id="slide-06-ai-and-ns06-%E6%98%93%E6%96%BC%E8%AD%98%E5%88%A5%E8%80%8C%E9%9D%9E%E6%86%91%E7%A9%BA%E8%A8%98%E6%86%B6---%E5%BB%BA%E8%AD%B0-prompt">Slide 06: AI and NS06 (易於識別，而非憑空記憶) - 建議 Prompt</h2>
<div class="prompt-box" style="font-size: 19px;">
<h3 id="%F0%9F%93%9D-%E5%BB%BA%E8%AD%B0-prompt-ai-for-ux-5"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 建議 Prompt (AI for UX)</h3>
<blockquote>
<p>「我們正在重構一個 [AI 寫作助手]。目前使用者進入系統後，只有一個全黑的空白輸入框，必須自行回想所有 AI 指令（例如：/summarize, /translate）。<br />
請遵循 <strong>Recognition Rather Than Recall</strong> 原則：</p>
<ol>
<li>設計一個在輸入框下方、可橫向滑動的常用指令卡片區。</li>
<li>當使用者在左側打字區選取特定段落時，設計一個在右側或游標旁彈出的快捷工具列（Contextual Menu），列出最適合該段落的 AI 工具選單。」</li>
</ol>
</blockquote>

<header>UX for AI: Human-Centered AI System Design</header>
<h2 id="slide-07-ai-and-ns07-%E4%BD%BF%E7%94%A8%E5%BD%88%E6%80%A7%E8%88%87%E6%95%88%E7%8E%87---ux-%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95">Slide 07: AI and NS07 (使用彈性與效率) - UX 設計心法</h2>
<blockquote>
<p><em>“系統應能滿足新手與專家的不同需求。提供快捷操作以提高效率。”</em></p>
</blockquote>
<div class="two-columns-64">
<div class="card" style="font-size: 21px;">
<h3 id="%F0%9F%92%A1-ai-%E7%94%A2%E5%93%81%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95-ux-for-ai-6"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> AI 產品設計心法 (UX for AI)</h3>
<ul>
<li data-marpit-fragment="1"><strong>專為高頻使用者設計的快捷路徑（Shortcuts）：</strong>
<ul>
<li data-marpit-fragment="2"><strong>斜線指令（Slash Commands）：</strong> 輸入 <code>/</code> 即可快速喚起功能選單（如 Notion AI 或 Slack）。</li>
<li data-marpit-fragment="3"><strong>@Mentions 跨領域調用：</strong> 輸入 <code>@</code> 快速指派特定專長的 AI 代理人或引用外部知識庫（如 <code>@Designer</code>、<code>@CodingBot</code>）。</li>
<li data-marpit-fragment="4"><strong>一鍵自訂（Prompt Presets）：</strong> 允許使用者將自己調校好、最常用的長 Prompt 存檔，設定成自訂按鈕（如：『以專業金融顧問的口吻回覆』快捷鍵）。</li>
</ul>
</li>
</ul>
</div>
<div class="card" style="font-size: 21px;">
<h3 id="%F0%9F%94%8D-%E7%9C%9F%E5%AF%A6%E7%B3%BB%E7%B5%B1%E6%87%89%E7%94%A8%E6%A1%88%E4%BE%8B-6"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f50d.svg" data-marp-twemoji=""/> 真實系統應用案例</h3>
<ul>
<li data-marpit-fragment="5"><strong>Cursor</strong> 的 <code>@-mentions</code> 與 Notion AI 的 <code>/</code> 斜線指令。</li>
<li data-marpit-fragment="6">針對高頻專業使用者， Cursor 允許在輸入框輸入 <code>@</code> 快速調用檔案 ( <code>@Files</code> )、資料夾 ( <code>@Folders</code> ) 或網頁 ( <code>@Web</code> )； Notion AI 支援輸入 <code>/</code> 快速喚起 AI 寫作助手，極大提升專家的操作效率。</li>
</ul>

<header>UX for AI: Human-Centered AI System Design</header>
<h2 id="slide-08-ai-and-ns08-%E7%BE%8E%E5%AD%B8%E8%88%87%E7%B0%A1%E7%B4%84%E8%A8%AD%E8%A8%88---ux-%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95">Slide 08: AI and NS08 (美學與簡約設計) - UX 設計心法</h2>
<blockquote>
<p><em>“投影片與介面不應包含無關或極少需要的資訊。每一個額外的資訊都會與重要資訊競爭注意波段。”</em></p>
</blockquote>
<div class="two-columns-73">
<div class="card" style="font-size: 21px;">
<h3 id="%F0%9F%92%A1-ai-%E7%94%A2%E5%93%81%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95-ux-for-ai-7"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> AI 產品設計心法 (UX for AI)</h3>
<ul>
<li data-marpit-fragment="1"><strong>避免 AI「資訊轟炸（Information Overload）」：</strong>
<ul>
<li data-marpit-fragment="2">AI 生成內容空間有限且往往極長。避免一次性將幾千字全部扔給使用者。</li>
<li data-marpit-fragment="3"><strong>預設折疊與展開（Show More）：</strong> 對於長篇文章、程式碼區塊或詳細的分析過程，預設僅顯示前 3 行與摘要，使用者有興趣再展開。</li>
<li data-marpit-fragment="4"><strong>善用資訊層級：</strong> 使用粗體、高亮、標籤晶片和適度的卡片區塊區隔資訊，保持版面的整潔與高度可讀性。</li>
</ul>
</li>
</ul>
</div>
<div class="card" style="font-size: 21px;">
<h3 id="%F0%9F%94%8D-%E7%9C%9F%E5%AF%A6%E7%B3%BB%E7%B5%B1%E6%87%89%E7%94%A8%E6%A1%88%E4%BE%8B-7"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f50d.svg" data-marp-twemoji=""/> 真實系統應用案例</h3>
<ul>
<li data-marpit-fragment="5"><strong>Claude Artifacts</strong> 獨立雙面板設計。</li>
<li data-marpit-fragment="6">Claude 將生成的長篇程式碼、網頁或圖表等複雜內容，自動拆分至右側獨立的預覽面板（ <strong>Artifacts</strong> ）中，避免左側對話框被幾千行的程式碼淹沒，保持版面極簡與高度可讀性。</li>
</ul>
</div>
</div>

<h2 id="slide-08-ai-and-ns08-%E7%BE%8E%E5%AD%B8%E8%88%87%E7%B0%A1%E7%B4%84%E8%A8%AD%E8%A8%88---%E5%BB%BA%E8%AD%B0-prompt">Slide 08: AI and NS08 (美學與簡約設計) - 建議 Prompt</h2>
<div class="prompt-box" style="font-size: 19px;">
<h3 id="%F0%9F%93%9D-%E5%BB%BA%E8%AD%B0-prompt-ai-for-ux-7"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 建議 Prompt (AI for UX)</h3>
<blockquote>
<p>「當我們的 [AI 商務分析師] 完成一個市場調研後，會自動生成一份包含數據表格、長篇分析、參考文獻、與 5 個圖表在內的巨大報告。目前的介面將這份報告像純文字檔一樣直接瀑布流灌入畫面，視覺非常混亂。<br />
請遵循 <strong>Aesthetic and Minimalist Design</strong> 原則，重新排版此報告介面：</p>
<ol>
<li>請提供折疊與層級化方案，將文獻與長段落數據進行智慧收納。</li>
<li>設計一個極簡的『資訊看板（Dashboard）』，只突出 3 個關鍵數據點，其他細節隱藏在點擊互動後呈現。」</li>
</ol>
</blockquote>

<header>UX for AI: Human-Centered AI System Design</header>
<h2 id="slide-09-ai-and-ns09-%E5%8D%94%E5%8A%A9%E8%BE%A8%E8%AD%98%E8%A8%BA%E6%96%B7%E8%88%87%E5%BE%9E%E9%8C%AF%E8%AA%A4%E4%B8%AD%E5%BE%A9%E5%8E%9F---ux-%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95">Slide 09: AI and NS09 (協助辨識、診斷與從錯誤中復原) - UX 設計心法</h2>
<blockquote>
<p><em>“錯誤訊息應以清晰白話呈現，精確指出問題，並建設性地提供具體解決方案。”</em></p>
</blockquote>
<div class="two-columns-73">
<div class="card" style="font-size: 21px;">
<h3 id="%F0%9F%92%A1-ai-%E7%94%A2%E5%93%81%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95-ux-for-ai-8"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> AI 產品設計心法 (UX for AI)</h3>
<ul>
<li data-marpit-fragment="1"><strong>優雅防範 AI「幻覺（Hallucination）」與「失效」：</strong>
<ul>
<li data-marpit-fragment="2">當 AI 的回答可能不準確或不符合事實時，介面應明確標記（如：「<img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a0.svg" data-marp-twemoji=""/> 此回答由 AI 生成，關鍵資訊請交叉核對」），並提供快速重新生成。</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>API 連線/超時報錯優雅降級（Graceful Degradation）：</strong>
<ul>
<li data-marpit-fragment="4">當 AI 服務過載（如 Token 耗盡、超時斷線），不要只拋出「HTTP 502 Bad Gateway」等狀態碼。</li>
<li data-marpit-fragment="5">應白話告訴使用者：「目前 AI 連線人數眾多，您的 Prompt 檔已自動儲存，您可以[一鍵重試]。」</li>
</ul>
</li>
</ul>
</div>
<div class="card" style="font-size: 21px;">
<h3 id="%F0%9F%94%8D-%E7%9C%9F%E5%AF%A6%E7%B3%BB%E7%B5%B1%E6%87%89%E7%94%A8%E6%A1%88%E4%BE%8B-8"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f50d.svg" data-marp-twemoji=""/> 真實系統應用案例</h3>
<ul>
<li data-marpit-fragment="6"><strong>Cursor</strong> 的終端機錯誤「Fix with AI」按鈕。</li>
<li data-marpit-fragment="7">當編譯或執行出錯時， Cursor 在終端機輸出區直接提供「Fix with AI」一鍵修復按鈕。點擊後 AI 會讀取錯誤訊息並自動生成修正方案，協助使用者快速從錯誤中復原，而非僅僅拋出看不懂的錯誤碼。</li>
</ul>
</div>
</div>

<h2 id="slide-09-ai-and-ns09-%E5%8D%94%E5%8A%A9%E8%BE%A8%E8%AD%98%E8%A8%BA%E6%96%B7%E8%88%87%E5%BE%9E%E9%8C%AF%E8%AA%A4%E4%B8%AD%E5%BE%A9%E5%8E%9F---%E5%BB%BA%E8%AD%B0-prompt">Slide 09: AI and NS09 (協助辨識、診斷與從錯誤中復原) - 建議 Prompt</h2>
<div class="prompt-box" style="font-size: 19px;">
<h3 id="%F0%9F%93%9D-%E5%BB%BA%E8%AD%B0-prompt-ai-for-ux-8"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 建議 Prompt (AI for UX)</h3>
<blockquote>
<p>「當我們的 [AI 自動翻譯器] 在處理使用者上傳的 50MB 超大型 PDF 檔時，因為超時（Timeout）導致系統斷開連線。<br />
請遵循 <strong>Help Users Recognize, Diagnose, and Recover from Errors</strong> 原則，幫我撰寫一套 UI 錯誤彈窗（Error Dialog）的文案與互動：</p>
<ol>
<li>說明原因（避免艱深程式碼）。</li>
<li>提供具體復原手段（如：建議使用者一鍵將文件自動拆分成 3 個小檔案上傳、或一鍵重試）。」</li>
</ol>
</blockquote>

<header>UX for AI: Human-Centered AI System Design</header>
<h2 id="slide-10-ai-and-ns10-%E8%AA%AA%E6%98%8E%E6%96%87%E4%BB%B6%E8%88%87%E8%BC%94%E5%8A%A9%E8%AA%AA%E6%98%8E---ux-%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95">Slide 10: AI and NS10 (說明文件與輔助說明) - UX 設計心法</h2>
<blockquote>
<p><em>“雖然不需文件就能操作系統是最好的，但隨時提供易於檢索、聚焦任務且簡潔的說明文件依然不可或缺。”</em></p>
</blockquote>
<div class="two-columns-73">
<div class="card" style="font-size: 21px;">
<h3 id="%F0%9F%92%A1-ai-%E7%94%A2%E5%93%81%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95-ux-for-ai-9"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> AI 產品設計心法 (UX for AI)</h3>
<ul>
<li data-marpit-fragment="1"><strong>「可解釋性 AI」（XAI, Explainable AI）即是最好的說明：</strong>
<ul>
<li data-marpit-fragment="2">AI 產生的推薦或決策，往往像個黑盒子。</li>
<li data-marpit-fragment="3">介面中必須在決策旁提供 <strong>「解釋說明（Explain this recommendation）」</strong> 的互動提示。例如：「為什麼我會看到這筆推薦？因為您在 3 天內曾瀏覽過 Python 與 UI 設計相關職缺。」這就是 AI 時代的「說明文件」。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>情境化動態引導（Context-sensitive Copilot）：</strong>
<ul>
<li data-marpit-fragment="5">揚棄傳統的大部頭 Help PDF。在輸入框旁設計輕量化的「互動式提示指南」，引導使用者逐步學會如何精準寫出「好 Prompt」。</li>
</ul>
</li>
</ul>
</div>
<div class="card" style="font-size: 21px;">
<h3 id="%F0%9F%94%8D-%E7%9C%9F%E5%AF%A6%E7%B3%BB%E7%B5%B1%E6%87%89%E7%94%A8%E6%A1%88%E4%BE%8B-9"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f50d.svg" data-marp-twemoji=""/> 真實系統應用案例</h3>
<ul>
<li data-marpit-fragment="6"><strong>Perplexity AI / ChatGPT Search</strong> 的數字引文腳註。</li>
<li data-marpit-fragment="7">AI 生成的內容可能存在幻覺。介面在每個事實論點旁標記數字腳註（例如 <code>[1]</code> , <code>[2]</code> ），滑鼠懸停或點擊可顯示該資訊的原始新聞或網頁來源，作為可信度的即時輔助說明。</li>
</ul>
</div>
</div>

<header>UX for AI: Human-Centered AI System Design</header>
<h2 id="%E5%AF%A6%E7%94%A8%E8%AC%9B%E7%BE%A9%E7%B2%BE%E9%80%B2%E6%8A%80%E5%B7%A7-%E5%B8%AB%E7%94%9F%E4%BA%92%E5%8B%95%E5%BB%BA%E8%AD%B0">實用講義精進技巧 (師生互動建議)</h2>
<div class="two-columns">
<div class="card">
<h3 id="1-before--after%E5%B0%8D%E6%AF%94%E6%B3%95">1. 「Before &amp; After」對比法</h3>
<ul>
<li data-marpit-fragment="1"><strong>不好的傳統 AI 介面</strong> ：
<ul>
<li data-marpit-fragment="2">空白對話框、缺少指引</li>
<li data-marpit-fragment="3">毫無狀態提示、死等 30 秒</li>
<li data-marpit-fragment="4">拋出 Raw Exception Log</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>現代 UX for AI 介面</strong> ：
<ul>
<li data-marpit-fragment="6">打字機 Streaming + 思考步驟 CoT</li>
<li data-marpit-fragment="7">豐富 Prompt 晶片與懸浮快捷選單</li>
<li data-marpit-fragment="8">友善降級與可解釋性 (XAI)</li>
</ul>
</li>
</ul>

<p><strong>[ 是 / 否 ]</strong></p>

<h2 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq2"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f64b.svg" data-marp-twemoji=""/> 概念核對問答 (CCQ2)</h2>
<div class="two-columns-64">
<div class="card">
<h3 id="%E2%9D%93-%E8%A4%87%E9%9B%9C%E9%95%B7%E4%BB%BB%E5%8B%99%E7%9A%84-ai-%E7%AD%89%E5%BE%85%E9%AB%94%E9%A9%97"><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2753.svg" data-marp-twemoji=""/> 複雜長任務的 AI 等待體驗</h3>
<p>當 AI 執行需耗時 15~20 秒的深度研究（如文獻交叉驗證）時，以下哪一種介面反饋設計最符合現代 UX for AI 的「透明度與等待心理學」？</p>
<ul>
<li data-marpit-fragment="1"><strong>(A)</strong> 顯示全螢幕單一旋轉 Spinner，註明「運算中請勿關閉」</li>
<li data-marpit-fragment="2"><strong>(B)</strong> 採用動態思考進度（CoT），即時滾動顯示「正在搜尋 12 篇文獻 ➔ 萃取論點 ➔ 驗證數據」，並支援折疊</li>
<li data-marpit-fragment="3"><strong>(C)</strong> 立即顯示空白頁，待全部完成後瞬間重新整理</li>
<li data-marpit-fragment="4"><strong>(D)</strong> 將 Timeout 強制縮短為 3 秒，未完成直接中斷報錯</li>
</ul>
