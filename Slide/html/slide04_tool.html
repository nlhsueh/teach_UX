<div class="card">
<h3 id="%E5%82%B3%E7%B5%B1%E7%80%91%E5%B8%83%E6%88%96%E5%8F%A3%E9%A0%AD%E6%BA%9D%E9%80%9A%E6%A8%A1%E5%BC%8F">傳統瀑布或口頭溝通模式</h3>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4dd.svg" data-marp-twemoji=""/> <strong>需求規格書 (PRD)</strong> ：厚達數十頁的抽象文字與流程圖。</li>

<li data-marpit-fragment="4"><img class="emoji" draggable="false" alt="💥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a5.svg" data-marp-twemoji=""/> <strong>交付成果 Demo</strong> ：「這跟我當初想像的完全不一樣！按鈕怎麼在這裡？操作太反人類了！」</li>

<header>AI-Powered UI/UX Prototyping</header>
<h2 id="%E8%BB%9F%E9%AB%94%E5%B7%A5%E7%A8%8B%E7%9A%84%E9%BB%83%E9%87%91%E6%B3%95%E5%89%871-10-100-%E6%B3%95%E5%89%87">軟體工程的黃金法則：1-10-100 法則</h2>
<div class="card">
<blockquote>
<p><strong>「在需求確認階段花 1 元修改的錯誤，到了開發階段要花 10 元，上線營運後要花 100 元甚至更多！」</strong></p>
</blockquote>
</div>
<div class="three-columns" style="margin-top: 16px;">
<div class="card">
<h3 id="%F0%9F%92%A1-%E9%9C%80%E6%B1%82%E8%88%87%E9%9B%9B%E5%BD%A2%E9%9A%8E%E6%AE%B5-1x"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 需求與雛形階段 (1x)</h3>
<ul>
<li data-marpit-fragment="1"><strong>成本</strong> ：低（數分鐘到數小時）</li>
<li data-marpit-fragment="2"><strong>方式</strong> ：AI 生成可互動雛形</li>
<li data-marpit-fragment="3"><strong>價值</strong> ：5 分鐘推翻重來毫無負擔，快速收斂真正需求。</li>
</ul>
</div>
<div class="card">
<h3 id="%E2%9A%99%EF%B8%8F-%E9%96%8B%E7%99%BC%E8%88%87%E7%B7%A8%E7%A8%8B%E9%9A%8E%E6%AE%B5-10x"><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2699.svg" data-marp-twemoji=""/> 開發與編程階段 (10x)</h3>
<ul>
<li data-marpit-fragment="4"><strong>成本</strong> ：中（數天到數週）</li>
<li data-marpit-fragment="5"><strong>方式</strong> ：重寫前端元件、重調 API</li>
<li data-marpit-fragment="6"><strong>痛點</strong> ：需協調前端、後端、QA 測試，進度嚴重延宕。</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%94%A5-%E4%B8%8A%E7%B7%9A%E8%88%87%E7%87%9F%E9%81%8B%E9%9A%8E%E6%AE%B5-100x"><img class="emoji" draggable="false" alt="🔥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f525.svg" data-marp-twemoji=""/> 上線與營運階段 (100x+)</h3>
<ul>
<li data-marpit-fragment="7"><strong>成本</strong> ：極高（數月 + 品牌信譽）</li>
<li data-marpit-fragment="8"><strong>方式</strong> ：緊急 Hotfix、資料遷移</li>
<li data-marpit-fragment="9"><strong>痛點</strong> ：使用者流失、客訴爆棚、甚至造成資安或財務損失。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>

<header>AI-Powered UI/UX Prototyping</header>
<h2 id="%E9%9B%9B%E5%BD%A2%E4%BF%9D%E7%9C%9F%E5%BA%A6%E7%9A%84%E6%BC%94%E9%80%B2-fidelity-spectrum">雛形保真度的演進 (Fidelity Spectrum)</h2>
<div class="three-columns">
<div class="card">
<h3 id="1-%E4%BD%8E%E4%BF%9D%E7%9C%9F-low-fi">1. 低保真 (Low-Fi)</h3>
<ul>
<li data-marpit-fragment="1"><strong>形式</strong> ：紙筆草圖、灰階線框圖 (Wireframe)。</li>
<li data-marpit-fragment="2"><strong>目的</strong> ：確認資訊架構 (IA) 與頁面排版佈局。</li>
<li data-marpit-fragment="3"><strong>限制</strong> ：缺乏視覺美感與真實動態互動。</li>
</ul>
</div>
<div class="card">
<h3 id="2-%E4%B8%AD%E4%BF%9D%E7%9C%9F-mid-fi">2. 中保真 (Mid-Fi)</h3>
<ul>
<li data-marpit-fragment="4"><strong>形式</strong> ：Figma 靜態設計稿、頁面跳轉流程。</li>
<li data-marpit-fragment="5"><strong>目的</strong> ：確認視覺階層、品牌色調與流程跳轉。</li>
<li data-marpit-fragment="6"><strong>限制</strong> ：無法輸入真實資料，動態狀態有限。</li>
</ul>
</div>
<div class="card">
<h3 id="3-%E9%AB%98%E4%BF%9D%E7%9C%9F-high-fi--code">3. 高保真 (High-Fi / Code)</h3>
<ul>
<li data-marpit-fragment="7"><strong>形式</strong> ：可互動程式碼原型 (React / Vue / HTML)。</li>
<li data-marpit-fragment="8"><strong>目的</strong> ：<strong>100% 還原真實操作體驗</strong> ，包含即時驗證、動畫與資料連動。</li>
<li data-marpit-fragment="9"><strong>AI 賦能</strong> ：<strong>過去需耗費數週，現在 AI 數十秒即刻產出！</strong></li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>

<header>AI-Powered UI/UX Prototyping</header>
<h2 id="1-wireframe-%E4%BD%8E%E4%BF%9D%E7%9C%9F%E7%B7%9A%E6%A1%86%E5%9C%96%E8%B3%87%E8%A8%8A%E9%AA%A8%E6%9E%B6%E8%88%87-ai-%E5%8D%94%E4%BD%9C">1. Wireframe (低保真線框圖)：資訊骨架與 AI 協作</h2>
<div class="two-columns">
<div class="card">
<h3 id="%E4%BB%80%E9%BA%BC%E6%98%AF-wireframe">什麼是 Wireframe？</h3>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4d0.svg" data-marp-twemoji=""/> <strong>產品結構藍圖</strong> ：使用灰階方塊、線條與佔位符，排除顏色與美工干擾。</li>
<li data-marpit-fragment="2"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>核心目標</strong> ：專注於 <strong>資訊架構 (IA)</strong> 、功能位置與內容優先級。</li>
<li data-marpit-fragment="3"><img class="emoji" draggable="false" alt="🧠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f9e0.svg" data-marp-twemoji=""/> <strong>降低認知干擾</strong> ：在早期討論中，避免團隊分心於按鈕顏色等表面細節。</li>
<li data-marpit-fragment="4"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a1.svg" data-marp-twemoji=""/> <strong>低成本快速試錯</strong> ：紙筆手繪或數位排版皆可，推翻重構成本趨近於零。</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%A4%96-ai-%E8%B3%A6%E8%83%BD%E8%88%87%E5%8D%94%E4%BD%9C%E6%A8%A1%E5%BC%8F"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f916.svg" data-marp-twemoji=""/> AI 賦能與協作模式</h3>
<ul>
<li data-marpit-fragment="5"><strong>Prompt-to-Wireframe</strong> ：輸入一句業務需求，AI（如 <code>Relume</code>、<code>Uizard</code>）自動生成全站 Sitemap 與頁面模組。</li>
<li data-marpit-fragment="6"><strong>手繪草圖數位化</strong> ：白板隨手手繪線框拍照，AI 自動向量化轉為可編輯組件。</li>
<li data-marpit-fragment="7"><strong>智能 UX 文案生成</strong> ：告別無意義的 <code>Lorem Ipsum</code>，AI 自動填入真實業務文字。</li>
</ul>
</div>
</div>

<h2 id="%E7%B7%B4%E7%BF%92-%F0%9F%8F%84%F0%9F%8F%BB%E2%80%8D%E2%99%80%EF%B8%8F%E4%BD%BF%E7%94%A8-relume-%E8%A8%AD%E8%A8%88%E8%BE%A6%E5%85%AC%E5%AE%A4%E9%BB%9E%E9%A4%90%E7%B3%BB%E7%B5%B1wireframe">練習 <img class="emoji" draggable="false" alt="🏄🏻‍♀️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3c4-1f3fb-200d-2640-fe0f.svg" data-marp-twemoji=""/>：使用 Relume 設計「辦公室點餐系統」Wireframe</h2>
<div class="card">
<h3 id="%F0%9F%8E%AF-%E4%BB%BB%E5%8B%99%E7%9B%AE%E6%A8%99%E9%81%8B%E7%94%A8-relume-ai-%E5%9C%A8-10-%E5%88%86%E9%90%98%E5%85%A7%E5%BB%BA%E7%AB%8B%E4%B8%A6%E5%BE%AE%E8%AA%BF%E5%87%BA%E7%90%86%E6%83%B3%E7%9A%84%E8%BE%A6%E5%85%AC%E5%AE%A4%E4%B8%8B%E5%8D%88%E8%8C%B6%E4%BE%BF%E7%95%B6%E9%BB%9E%E9%A4%90%E7%B7%9A%E6%A1%86%E5%9C%96"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3af.svg" data-marp-twemoji=""/> 任務目標：運用 Relume AI 在 10 分鐘內建立並微調出理想的辦公室下午茶/便當點餐線框圖</h3>
</div>
<div class="two-columns" style="margin-top: 14px;">
<div class="card">
<h3 id="%F0%9F%93%9D-%E5%AF%A6%E4%BD%9C%E6%AD%A5%E9%A9%9F"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 實作步驟</h3>
<ol>
<li><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f310.svg" data-marp-twemoji=""/> 開啟 <strong><a href="https://www.relume.ai/">Relume.ai</a></strong> 建立免費專案。</li>
<li><img class="emoji" draggable="false" alt="💬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4ac.svg" data-marp-twemoji=""/> 輸入提示詞描述業務需求：
<ul>
<li data-marpit-fragment="1"><em>「設計一個辦公室團隊點餐系統，包含今日推薦菜單、客製化選項（甜度/冰塊/加料）、個人購物車、以及主揪即時匯總統計看板。」</em></li>
</ul>
</li>
<li><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4d0.svg" data-marp-twemoji=""/> 檢視 AI 自動生成的 Sitemap 與 Wireframe 線框圖。</li>
<li><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f504.svg" data-marp-twemoji=""/> <strong>調整至少兩個區塊/圖形</strong> ：
<ul>
<li data-marpit-fragment="2">替換或重新生成不符合想像的排版模組；</li>
<li data-marpit-fragment="3">調整元件順序與文案，直到完全符合你的設計想像！</li>
</ul>
</li>
</ol>
</div>
<div class="card">
<h3 id="%F0%9F%92%A1-%E8%A9%95%E4%BC%B0%E8%88%87%E5%8F%8D%E6%80%9D%E8%A6%81%E9%BB%9E"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 評估與反思要點</h3>
<ul>
<li data-marpit-fragment="4"><strong>資訊階層</strong> ：菜單名稱、價格與「加入點餐」按鈕是否足夠顯眼？</li>
<li data-marpit-fragment="5"><strong>狀態能見度 (NS01)</strong> ：是否能即時看見目前「已點餐人數 / 總人數」進度？</li>
<li data-marpit-fragment="6"><strong>錯誤預防 (NS05)</strong> ：是否有防呆機制避免重複送出或遺漏必填選項？</li>
<li data-marpit-fragment="7"><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f680.svg" data-marp-twemoji=""/> <strong>體驗心得</strong> ：比起傳統從零手繪，AI 幫你省下了多少構思與對齊架構的時間？</li>
</ul>

<header>AI-Powered UI/UX Prototyping</header>
<h2 id="ai-%E9%9B%9B%E5%BD%A2%E5%B7%A5%E5%85%B7%E5%85%A8%E6%99%AF%E5%88%86%E9%A1%9E-tool-landscape">AI 雛形工具全景分類 (Tool Landscape)</h2>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%9B%A0%EF%B8%8F-1-%E5%85%A8%E7%AB%AF%E7%A8%8B%E5%BC%8F%E7%A2%BC%E5%9E%8B%E9%9B%9B%E5%BD%A2-code-first"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f6e0.svg" data-marp-twemoji=""/> 1. 全端/程式碼型雛形 (Code-First)</h3>
<p>直接生成可運行的 Web/React 前端程式碼，支援真實點擊、狀態管理與資料輸入：</p>
<ul>
<li data-marpit-fragment="1"><strong><code>v0 by Vercel</code></strong> （React + Tailwind + Shadcn UI）</li>
<li data-marpit-fragment="2"><strong><code>Lovable.dev</code></strong> （Fullstack App + Supabase 資料庫）</li>
<li data-marpit-fragment="3"><strong><code>Bolt.new</code></strong> （瀏覽器原生 Fullstack WebContainer）</li>
<li data-marpit-fragment="4"><strong><code>Claude Artifacts / ChatGPT Canvas</code></strong> （輕量級單頁快速預覽）</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%8E%A8-2-%E8%A8%AD%E8%A8%88%E7%95%AB%E5%B8%83%E5%9E%8B%E9%9B%9B%E5%BD%A2-design-first"><img class="emoji" draggable="false" alt="🎨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3a8.svg" data-marp-twemoji=""/> 2. 設計/畫布型雛形 (Design-First)</h3>
<p>專注於視覺設計稿、線框圖、Figma 整合與整體站點規劃：</p>
<ul>
<li data-marpit-fragment="5"><strong><code>Uizard</code></strong> （手繪草圖轉 UI + AI 易用性熱區圖）</li>
<li data-marpit-fragment="6"><strong><code>Galileo AI</code></strong> （高保真 UI 向量設計稿生成）</li>
<li data-marpit-fragment="7"><strong><code>Relume</code></strong> （Sitemap 規劃 + 線框圖無縫匯入 Figma）</li>
<li data-marpit-fragment="8"><strong><code>Figma AI</code></strong> （原生畫布自動排版與元件填充）</li>
</ul>
</div>

<div class="two-columns-64">
<div class="card">
<h3 id="%E6%A0%B8%E5%BF%83%E7%89%B9%E6%80%A7%E8%88%87%E5%84%AA%E5%8B%A2">核心特性與優勢</h3>
<ul>
<li data-marpit-fragment="1"><strong>技術棧</strong> ：React + Tailwind CSS + Lucide Icons + <code>shadcn/ui</code>。</li>
<li data-marpit-fragment="2"><strong>精準區塊編輯</strong> ：可圈選畫面上任一特定按鈕或卡片，單獨下指令修改。</li>
<li data-marpit-fragment="3"><strong>無縫工程交接</strong> ：產出乾淨、符合現代前端最佳實踐的 React 原始碼，一鍵 <code>npx shadcn add</code> 複製。</li>
<li data-marpit-fragment="4"><strong>版本時光機</strong> ：隨時比對每次 Prompt 迭代的介面差異並支援回退。</li>
</ul>
<h3 id="%E9%81%A9%E7%94%A8%E6%83%85%E5%A2%83">適用情境</h3>
<ul>
<li data-marpit-fragment="5">Dashboard 後台管理系統、複雜表單輸入、SaaS 產品介面。</li>
</ul>
</div>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">請設計一個「智慧會議室預約系統」的 Dashboard。

1. 頂部搜尋欄與日期選擇器
2. 左右雙欄：左側會議室即時狀態卡片
   （容納人數、設備標籤、空閒/使用中）
3. 右側時間軸甘特圖（可拖曳時段預約）

請使用乾淨洗鍊的現代深藍與白配色。

<div class="two-columns">
<div class="card">
<h3 id="%E6%A0%B8%E5%BF%83%E7%89%B9%E8%89%B2-1">核心特色</h3>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a1.svg" data-marp-twemoji=""/> <strong>Node.js in Browser</strong> ：基於 WebContainers 技術，直接在瀏覽器執行 npm 套件與後端伺服器。</li>
<li data-marpit-fragment="2"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4e6.svg" data-marp-twemoji=""/> <strong>全套技術棧任選</strong> ：Next.js、Vite、Remix、Astro、Vue、Svelte 皆可一鍵生成。</li>
<li data-marpit-fragment="3"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f50d.svg" data-marp-twemoji=""/> <strong>完整專案目錄樹</strong> ：直接查看與編輯所有原始碼檔案（<code>package.json</code>、組件、API Route）。</li>
<li data-marpit-fragment="4"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f6e0.svg" data-marp-twemoji=""/> <strong>自動修復報錯</strong> ：當終端機或建置出錯時，AI 會主動讀取 Error Log 並一鍵修復。</li>
</ul>
</div>
<div class="card">
<h3 id="%E9%81%A9%E5%90%88%E7%9A%84%E5%89%8D%E6%9C%9F%E7%A2%BA%E8%AA%8D%E5%A0%B4%E6%99%AF-1">適合的前期確認場景</h3>
<ul>
<li data-marpit-fragment="5">工程團隊進行技術可行性評估 (Technical Spike)。</li>
<li data-marpit-fragment="6">需要使用特定 NPM 前端套件（如 Recharts 圖表庫、Leaflet 地圖庫）的複雜互動原型。</li>

</ul>

<header>AI-Powered UI/UX Prototyping</header>
<h2 id="step-1-%E9%9C%80%E6%B1%82%E8%A8%AA%E8%AB%87%E8%88%87-user-story-%E6%A2%B3%E7%90%86">Step 1: 需求訪談與 User Story 梳理</h2>
<div class="two-columns">
<div class="card">
<h3 id="%E5%82%B3%E7%B5%B1%E5%81%9A%E6%B3%95-vs-ai-%E8%B3%A6%E8%83%BD">傳統做法 vs AI 賦能</h3>
<ul>
<li data-marpit-fragment="1">傳統：手寫訪談筆記，整理需求需耗費 1~2 天。</li>
<li data-marpit-fragment="2"><strong>AI 賦能</strong> ：將使用者訪談錄音逐字稿餵給 AI，由 AI 自動萃取痛點、Persona 與 User Stories。</li>
</ul>
<h3 id="%E6%A0%B8%E5%BF%83%E7%94%A2%E5%87%BA%E7%89%A9">核心產出物</h3>
<ul>
<li data-marpit-fragment="3"><strong>使用者角色 (Persona)</strong> ：目標族群、痛點、動機。</li>
<li data-marpit-fragment="4"><strong>使用者故事 (User Stories)</strong> ：
<ul>
<li data-marpit-fragment="5"><code>作為一個 [角色]，我想要 [功能]，以便於 [達成目標]。</code></li>
</ul>
</li>
<li data-marpit-fragment="6"><strong>驗收準則 (Acceptance Criteria / Gherkin)</strong> 。</li>
</ul>
</div>
<div class="prompt-box" style="font-size: 17px;">
<h3 id="%F0%9F%92%A1-ai-%E8%BC%94%E5%8A%A9%E5%88%86%E6%9E%90-prompt-%E7%AF%84%E4%BE%8B"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> AI 輔助分析 Prompt 範例</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">你是一位資深 UX 研究員。以下是一段「學生選課系統」的使用者訪談逐字稿。
請幫我：
1. 列出使用者的 3 大核心痛點。
2. 產出 5 個關鍵的 User Stories (含 As a/I want/So that)。
3. 為每個 User Story 定義明確的 Given-When-Then 驗收標準。
</code></pre>
</div>
</div>

<header>AI-Powered UI/UX Prototyping</header>
<h2 id="step-3-ai-%E5%BF%AB%E9%80%9F%E7%94%9F%E6%88%90%E9%AB%98%E4%BF%9D%E7%9C%9F%E4%BA%92%E5%8B%95%E9%9B%9B%E5%BD%A2">Step 3: AI 快速生成高保真互動雛形</h2>
<div class="two-columns">
<div class="card">
<h3 id="%E6%A0%B8%E5%BF%83%E5%BF%83%E6%B3%95%E7%B5%90%E6%A7%8B%E5%8C%96%E6%8F%90%E7%A4%BA-structured-prompting">核心心法：結構化提示 (Structured Prompting)</h3>
<ul>
<li data-marpit-fragment="1">避免給予模糊指令（如：「給我一個漂亮的後台」）。</li>
<li data-marpit-fragment="2"><strong>採用黃金 5 要素</strong> ：
<ol>
<li><img class="emoji" draggable="false" alt="🏢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3e2.svg" data-marp-twemoji=""/> <strong>角色與場景</strong> （誰在用？在哪裡用？）</li>
<li><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4d0.svg" data-marp-twemoji=""/> <strong>佈局規範</strong> （Navbar、Sidebar、卡片網格、雙欄）</li>
<li><img class="emoji" draggable="false" alt="🎨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3a8.svg" data-marp-twemoji=""/> <strong>視覺風格</strong> （現代極簡、Tailwind 配色、暗色模式）</li>
<li><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f504.svg" data-marp-twemoji=""/> <strong>動態與互動</strong> （點擊彈窗、Tab 切換、篩選即時連動）</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>邊界與防呆</strong> （空狀態 Empty State、錯誤提示、Loading 動畫）</li>
</ol>
</li>
</ul>
</div>
<div class="card">
<h3 id="%E5%B7%A5%E5%85%B7%E9%81%B8%E6%93%87%E5%BB%BA%E8%AD%B0">工具選擇建議</h3>
<ul>
<li data-marpit-fragment="3"><strong>需要純元件展示</strong> ➔ <code>v0.dev</code></li>
<li data-marpit-fragment="4"><strong>需要完整多頁流程與資料庫</strong> ➔ <code>Lovable.dev</code></li>
<li data-marpit-fragment="5"><strong>需要對外分享至手機操作</strong> ➔ <code>Lovable</code> 部署網址</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>小秘訣</strong> ：第一版先生成 80% 骨架，再針對局部區塊逐步提示優化，切忌一次塞入過多需求。</p>
</blockquote>

<div class="prompt-box" style="font-size: 18px;">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">你是一位資深前端 UI/UX 工程師。請使用 React、Tailwind CSS 與 Lucide Icons
設計一個「線上學習平台 - 教師分析後台 (Teacher Analytics Dashboard)」。

【版面架構】
1. 頂部列：顯示班級切換下拉選單、學期篩選器、以及「匯出報表」按鈕。
2. 頂部 KPI 卡片區（4 欄）：
   - 總選課人數 (含較上週成長率綠色 Badge)
   - 作業繳交率 (進度環形條)
   - 平均測驗成績
   - 需關懷學生數 (紅色警示 Badge)
3. 主要圖表區 (雙欄 7:3)：
   - 左側：每週作業提交趨勢折線圖
   - 右側：待批改作業清單（附帶一鍵批改按鈕與倒數提醒）
4. 底部：學生成績分佈表格（具備排序、分頁與搜尋過濾功能）。

【互動與防呆要求】
- 滑鼠懸停於表格時需有背景高亮反饋。
- 若無待批改作業，右側需顯示「目前全部批改完成 <img class="emoji" draggable="false" alt="🎉" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f389.svg" data-marp-twemoji=""/>」的 Empty State。
</code></pre>

<header>AI-Powered UI/UX Prototyping</header>
<h2 id="ai-%E9%9B%9B%E5%BD%A2%E7%94%9F%E6%88%90%E7%9A%84%E5%B8%B8%E8%A6%8B%E7%9B%B2%E9%BB%9E%E8%88%87%E9%81%BF%E5%9D%91%E6%8C%87%E5%8D%97">AI 雛形生成的常見盲點與避坑指南</h2>
<div class="three-columns">
<div class="card">
<h3 id="%E2%9D%8C-%E7%9B%B2%E9%BB%9E-1-%E5%8F%AA%E9%A1%A7%E5%A5%BD%E7%9C%8B%E5%BF%BD%E7%95%A5%E7%9C%9F%E5%AF%A6%E8%B3%87%E6%96%99"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> 盲點 1: 只顧好看，忽略真實資料</h3>
<ul>
<li data-marpit-fragment="1"><strong>問題</strong> ：AI 常填入完美長度的假文字，畫面很美；但真實用戶名字超長或內容破千字時直接破版。</li>
<li data-marpit-fragment="2"><strong>解法</strong> ：在 Prompt 中要求處理 <strong>文字截斷 (Truncation)</strong> 、省略號 <code>...</code> 與換行。</li>
</ul>
</div>
<div class="card">
<h3 id="%E2%9D%8C-%E7%9B%B2%E9%BB%9E-2-%E7%BC%BA%E4%B9%8F%E6%A5%B5%E7%AB%AF%E7%8B%80%E6%85%8B-edge-cases"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> 盲點 2: 缺乏極端狀態 (Edge Cases)</h3>
<ul>
<li data-marpit-fragment="3"><strong>問題</strong> ：只設計最理想的成功狀態，完全遺漏「網路斷線」、「查無結果」、「無權限」等狀態。</li>
<li data-marpit-fragment="4"><strong>解法</strong> ：明確要求 AI 生成 <strong>Empty State</strong> 、<strong>Error State</strong> 與 <strong>Loading Skeleton</strong> 。</li>
</ul>
</div>
<div class="card">
<h3 id="%E2%9D%8C-%E7%9B%B2%E9%BB%9E-3-%E7%94%A2%E7%94%9F%E7%84%A1%E6%95%88%E6%88%96%E9%9B%A3%E7%B6%AD%E8%AD%B7%E7%A8%8B%E5%BC%8F%E7%A2%BC"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> 盲點 3: 產生無效或難維護程式碼</h3>
<ul>
<li data-marpit-fragment="5"><strong>問題</strong> ：AI 可能拼湊出過度巢狀的 CSS 或過時的 JavaScript 寫法。</li>
<li data-marpit-fragment="6"><strong>解法</strong> ：限定使用具備 Design System 規範的組件庫（如 <code>shadcn/ui</code> 或 <code>Tailwind</code>）。</li>
</ul>
</div>
</div>

<li data-marpit-fragment="3">包含狀態反饋（借用成功、已被預約）。</li>
</ul>
</li>

<div class="card">
<h3 id="%F0%9F%92%A1-ai-%E4%B8%8D%E6%9C%83%E5%8F%96%E4%BB%A3-ux-%E8%A8%AD%E8%A8%88%E5%B8%AB%E8%88%87%E5%B7%A5%E7%A8%8B%E5%B8%AB%E4%BD%86%E5%96%84%E7%94%A8-ai-%E5%BF%AB%E9%80%9F%E9%A9%97%E8%AD%89%E9%AB%94%E9%A9%97%E7%9A%84%E5%9C%98%E9%9A%8A%E5%B0%87%E6%B7%98%E6%B1%B0%E5%82%B3%E7%B5%B1%E5%9C%98%E9%9A%8A"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> AI 不會取代 UX 設計師與工程師，但「善用 AI 快速驗證體驗」的團隊將淘汰傳統團隊！</h3>
</div>
<div class="three-columns" style="margin-top: 16px;">
<div class="card">
<h3 id="1-%E9%80%9F%E5%BA%A6%E5%8D%B3%E7%AB%B6%E7%88%AD%E5%8A%9B">1. 速度即競爭力</h3>
<p>將雛形驗證週期從 <strong>「數週」壓縮至「數十分鐘」</strong> ，大幅降低溝通與試錯成本。</p>
</div>
<div class="card">
<h3 id="2-%E7%9C%9F%E5%AF%A6%E6%93%8D%E4%BD%9C%E5%8B%9D%E9%81%8E%E5%8D%83%E8%A8%80%E8%90%AC%E8%AA%9E">2. 真實操作勝過千言萬語</h3>
<p>讓利害關係人「親手點擊」真實原型，在程式碼落地的第一天就消滅所有需求誤解。</p>

<div class="card">
<h3 id="3-%E6%B0%B8%E9%81%A0%E4%BB%A5%E4%BA%BA%E7%82%BA%E6%9C%AC">3. 永遠以人為本</h3>
<p>工具再快，核心依然是 <strong>以使用者為中心的 UX 原則</strong> （Nielsen 10 大原則、心理學與無障礙設計）。</p>
</div>
