  (function() {
    let pageBuffer = '';
    let bufferTimer = null;

    function getOrCreateIndicator() {
      let el = document.getElementById('marp-page-jump-indicator');
      if (!el) {
        el = document.createElement('div');
        el.id = 'marp-page-jump-indicator';
        el.style.cssText = 'position: fixed; bottom: 30px; right: 30px; background: rgba(15, 23, 42, 0.9); color: white; padding: 8px 16px; border-radius: 8px; font-family: system-ui, sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 0.5px; z-index: 9999; box-shadow: 0 4px 14px rgba(0,0,0,0.25); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2); display: none; transition: all 0.15s ease;';
        document.body.appendChild(el);
      }
      return el;
    }

    window.addEventListener('keydown', function(e) {
      if (['INPUT', 'TEXTAREA'].includes(e.target.tagName) || e.altKey || e.ctrlKey || e.metaKey) return;

      if (e.key >= '0' && e.key <= '9') {
        pageBuffer += e.key;
        clearTimeout(bufferTimer);
        indicator.textContent = '📄 跳至第 ' + pageBuffer + ' 頁 (按 Enter 確認)';

        bufferTimer = setTimeout(function() {
          pageBuffer = '';
          indicator.style.display = 'none';
        }, 2500);
      } else if (e.key === 'Enter' && pageBuffer.length > 0) {
        e.preventDefault();
        const target = parseInt(pageBuffer, 10);
        pageBuffer = '';
        indicator.style.display = 'none';
        clearTimeout(bufferTimer);

        if (!isNaN(target) && target > 0) {
          const oldHash = window.location.hash;
          const newHash = '#' + target;
          if (oldHash === newHash) {
            window.dispatchEvent(new HashChangeEvent('hashchange'));
          } else {
            window.location.hash = newHash;
          }
        }
      } else if (e.key === 'Escape' || e.key === 'Backspace') {
        if (e.key === 'Backspace' && pageBuffer.length > 1) {
          pageBuffer = pageBuffer.slice(0, -1);
          indicator.textContent = '📄 跳至第 ' + pageBuffer + ' 頁 (按 Enter 確認)';
        } else {
          pageBuffer = '';
          indicator.style.display = 'none';
          clearTimeout(bufferTimer);
        }

<h2 id="tw14--tw16%E5%BD%88%E6%80%A7%E5%BB%B6%E9%81%B2%E8%88%87%E6%BC%B8%E9%80%B2">TW1.4 ~ TW1.6：彈性、延遲與漸進</h2>
<div class="three-columns">
<div class="card">
<h3 id="tw14-%E4%B8%AD%E9%80%94%E6%94%B9%E8%AE%8A">TW1.4 中途改變</h3>
<ul>
<li><strong>「我改主意了，讓我隨時調整」</strong></li>
<li>高鐵查詢結果頁上方直接保留搜尋列，可立即更換時段。</li>

</ul>
</div>
<div class="card">
<h3 id="tw15-%E5%BB%B6%E9%81%B2%E9%81%B8%E6%93%87">TW1.5 延遲選擇</h3>
<ul>
<li><strong>「我現在不想填這個，讓我先用」</strong></li>
<li>降低註冊門檻，必填欄位降到最低，提供「稍後再設定」。</li>
<li>對應 NS08。</li>
</ul>
</div>
<div class="card">
<h3 id="tw16-%E6%BC%B8%E9%80%B2%E5%BB%BA%E6%A7%8B">TW1.6 漸進建構</h3>
<ul>
<li><strong>「改一點、看一下，逐步完善」</strong></li>
<li>即時反應變化，自動暫存草稿，提供即時預覽反饋。</li>
<li>對應 NS01。</li>
</ul>

<header>Tidwell Interaction Design Patterns</header>
<h2 id="tw17--tw112%E7%BF%92%E6%85%A3%E7%A9%BA%E9%96%93%E8%88%87%E9%8D%B5%E7%9B%A4">TW1.7 ~ TW1.12：習慣、空間與鍵盤</h2>
<div class="three-columns">
<div class="card">
<h3 id="tw17-%E7%BF%92%E6%85%A3%E5%B0%B1%E5%A5%BD">TW1.7 習慣就好</h3>
<ul>
<li>遵循使用者的肌肉記憶（<code>Ctrl+C</code>、儲存圖示）。</li>
<li>確認鍵位置切勿頻繁變換。</li>
<li>對應 NS04。</li>
</ul>
</div>
<div class="card">
<h3 id="tw19-%E7%A9%BA%E9%96%93%E8%A8%98%E6%86%B6">TW1.9 空間記憶</h3>
<ul>
<li><strong>「別幫我亂移桌上的東西」</strong></li>
<li>常用功能固定在相同位置，避免選單位置動態亂跳。</li>
<li>對應 NS04, NS06。</li>
</ul>
</div>
<div class="card">
<h3 id="tw112-%E5%8F%AA%E7%94%A8%E9%8D%B5%E7%9B%A4">TW1.12 只用鍵盤</h3>
<ul>
<li>專家使用者不希望手離開鍵盤。</li>
<li>支援完整 Tab 切換與快速鍵，Enter 鍵設定安全預設。</li>
<li>對應 NS07。</li>
</ul>
</div>
</div>

<h2 id="chapter-2-%E7%B5%84%E7%B9%94%E5%85%A7%E5%AE%B9-organizing-content">Chapter 2: 組織內容 (Organizing Content)</h2>

<div>
<ul>

<li><strong>TW2.11 協助系統 (Help Systems)</strong></li>
<li><strong>TW2.12 標記分類 (Tagging)</strong></li>
</ul>

<header>Tidwell Interaction Design Patterns</header>
<h2 id="tw21-%E5%87%B8%E9%A1%AF%E6%90%9C%E5%B0%8B%E8%88%87%E7%80%8F%E8%A6%BD-feature-search-browse">TW2.1 凸顯、搜尋與瀏覽 (Feature, Search, Browse)</h2>
<div class="two-columns-64">
<div class="card">
<h3 id="%E7%8F%BE%E4%BB%A3%E5%85%A7%E5%AE%B9%E7%99%BC%E7%8F%BE%E7%9A%84%E4%B8%89%E5%A4%A7%E6%94%AF%E6%9F%B1">現代內容發現的三大支柱</h3>
<ul>
<li><strong>凸顯 (Feature)</strong> ：在首頁核心視覺區推薦最重要、最吸引人的焦點內容或即時活動。</li>
<li><strong>搜尋 (Search)</strong> ：針對目標明確的使用者，提供自動補全搜尋框與多維度篩選器 (Facets)。</li>
<li><strong>瀏覽 (Browse)</strong> ：針對探索型使用者，提供圖文分類網格與清晰目錄。</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%92%A1-%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95%E8%88%87%E9%81%A9%E7%94%A8%E6%83%85%E5%A2%83"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 設計心法與適用情境</h3>
<ul>
<li><strong>經典範例</strong> ：電商首頁 (Momo, Amazon)、串流影音 (Netflix)、新聞入口。</li>
<li><strong>核心價值</strong> ：同時滿足「隨意逛逛」與「精準找尋」兩種截然不同的使用者意圖。</li>
</ul>
</div>
</div>

<header>Tidwell Interaction Design Patterns</header>
<h2 id="%E5%85%A7%E5%AE%B9%E7%B5%84%E7%B9%94%E6%A0%B8%E5%BF%83%E6%A8%A1%E5%BC%8F%E7%B2%BE%E9%9D%88%E5%84%80%E8%A1%A8%E6%9D%BF%E8%88%87%E6%BC%B8%E9%80%B2%E6%8F%AD%E9%9C%B2">內容組織核心模式：精靈、儀表板與漸進揭露</h2>
<div class="three-columns">
<div class="card">
<h3 id="tw25-%E5%84%80%E8%A1%A8%E6%9D%BF-dashboard">TW2.5 儀表板 (Dashboard)</h3>
<ul>
<li>以豐富圖表視覺化呈現關鍵 KPI 與即時數據。</li>
<li>定期自動更新，支援點擊鑽取 (Drilldown)。</li>
</ul>
</div>
<div class="card">
<h3 id="tw27-%E7%B2%BE%E9%9D%88-wizard">TW2.7 精靈 (Wizard)</h3>
<ul>
<li>針對複雜任務，拆解為 <code>Step 1 ➔ 2 ➔ 3</code> 的線性引導。</li>
<li>降低使用者的認知負擔。</li>
</ul>
</div>
<div class="card">
<h3 id="%E6%BC%B8%E9%80%B2%E5%BC%8F%E6%8F%AD%E9%9C%B2-progressive-disclosure">漸進式揭露 (Progressive Disclosure)</h3>
<ul>
<li><strong>回應式生效 (Responsive Enabling)</strong> ：勾選某選項後才啟用相關子欄位。</li>
<li>預設隱藏進階參數。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>

<header>Tidwell Interaction Design Patterns</header>
<h2 id="tw28-%E8%A8%AD%E5%AE%9A%E7%B7%A8%E8%BC%AF%E5%99%A8-settings-editor">TW2.8 設定編輯器 (Settings Editor)</h2>
<div class="two-columns-64">
<div class="card">
<h3 id="%E9%9B%86%E4%B8%AD%E5%BC%8F%E5%8F%83%E6%95%B8%E8%88%87%E5%80%8B%E4%BA%BA%E5%8C%96%E5%81%8F%E5%A5%BD%E7%AE%A1%E7%90%86">集中式參數與個人化偏好管理</h3>
<ul>
<li><strong>分類分群</strong> ：將繁雜設定依模組分類（帳號、隱私安全、外觀、API 整合），避免單頁過長。</li>
<li><strong>即時反饋 (Auto-save)</strong> ：首選即時儲存並在頂部顯示狀態提示（如「已自動儲存」），減少額外點擊儲存按鈕。</li>
<li><strong>防呆警示 (Danger Zone)</strong> ：將敏感或破壞性操作（如刪除帳號）隔離於底部並以紅色標註二次確認。</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%92%A1-%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95%E8%88%87%E9%81%A9%E7%94%A8%E6%83%85%E5%A2%83-1"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 設計心法與適用情境</h3>
<ul>
<li><strong>經典範例</strong> ：SaaS 控制台、系統偏好設定、VS Code 設定頁。</li>
<li><strong>核心價值</strong> ：提供清晰的控制權（NS03），降低誤觸風險（NS05）。</li>
</ul>
</div>

<header>Tidwell Interaction Design Patterns</header>
<h2 id="tw29-%E5%82%99%E6%93%87%E6%AA%A2%E8%A6%96-alternative-views">TW2.9 備擇檢視 (Alternative Views)</h2>
<div class="two-columns-64">
<div class="card">
<h3 id="%E5%90%8C%E4%B8%80%E8%B3%87%E6%96%99%E7%9A%84%E5%A4%9A%E7%B6%AD%E5%BA%A6%E8%A6%96%E8%A7%92%E5%88%87%E6%8F%9B">同一資料的多維度視角切換</h3>
<ul>
<li><strong>模式本質</strong> ：底層資料模型完全相同，但在介面上提供多種呈現維度以滿足不同工作情境。</li>
<li><strong>常見檢視類型</strong> ：
<ul>
<li><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4cb.svg" data-marp-twemoji=""/> <strong>表格清單 (Table List)</strong> ：適合批次檢視、排序與精確欄位比對。</li>
<li><img class="emoji" draggable="false" alt="🗂️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f5c2.svg" data-marp-twemoji=""/> <strong>看板模式 (Kanban Board)</strong> ：強調工作流程與狀態推進。</li>
<li><img class="emoji" draggable="false" alt="📅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4c5.svg" data-marp-twemoji=""/> <strong>行事曆 / 時間軸 (Calendar &amp; Timeline)</strong> ：聚焦死線與時程依賴關係。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%92%A1-%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95%E8%88%87%E9%81%A9%E7%94%A8%E6%83%85%E5%A2%83-2"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 設計心法與適用情境</h3>
<ul>
<li><strong>經典範例</strong> ：Notion 數據庫、Jira 專案看板、Airtable。</li>
<li><strong>核心價值</strong> ：大幅提升專業工作效率與彈性（NS07）。</li>
</ul>
</div>
</div>

<header>Tidwell Interaction Design Patterns</header>
<h2 id="tw35-%E6%B7%B1%E9%80%A3%E6%8E%A5-deep-links">TW3.5 深連接 (Deep Links)</h2>
<div class="two-columns-64">
<div class="card">
<h3 id="%E7%9B%B4%E9%81%94%E5%85%A7%E5%AE%B9%E6%A0%B8%E5%BF%83%E7%9A%84%E7%B2%BE%E7%A2%BA%E5%B0%8E%E8%88%AA">直達內容核心的精確導航</h3>
<ul>
<li><strong>模式本質</strong> ：為特定頁面中的「特定區塊、標題、評論或項目」提供獨立可分享的專屬 URL。</li>
<li><strong>核心互動</strong> ：
<ul>
<li>懸浮於段落或標題時出現 <img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f517.svg" data-marp-twemoji=""/> 錨點圖示。</li>
<li>提供「複製特定段落連結 (Copy Deep Link)」與一鍵分享。</li>
<li>點擊進入時，頁面自動平滑捲動至目標位置並以高亮提示。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%92%A1-%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95%E8%88%87%E9%81%A9%E7%94%A8%E6%83%85%E5%A2%83-3"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 設計心法與適用情境</h3>
<ul>
<li><strong>經典範例</strong> ：Figma 畫布定位連結、Notion 區塊連結、Google Docs 評論錨點。</li>
<li><strong>核心價值</strong> ：消除「進去首頁後找不到在哪」的溝通摩擦，團隊協作效率倍增。</li>
</ul>
</div>

<header>Tidwell Interaction Design Patterns</header>
<h2 id="tw37-%E5%AF%AC%E9%81%B8%E5%96%AE--%E8%B6%85%E7%B4%9A%E9%81%B8%E5%96%AE-fat-menus--mega-menus">TW3.7 寬選單 / 超級選單 (Fat Menus / Mega Menus)</h2>
<div class="two-columns-64">
<div class="card">
<h3 id="%E4%B8%80%E8%A6%BD%E7%84%A1%E9%81%BA%E7%9A%84%E4%BA%8C%E7%B6%AD%E5%85%A8%E7%AB%99%E6%9E%B6%E6%A7%8B%E5%B0%8E%E8%88%AA">一覽無遺的二維全站架構導航</h3>
<ul>
<li><strong>突破傳統下拉限制</strong> ：將傳統單欄長下拉選單展開為橫跨畫面的多欄二維資訊矩陣。</li>
<li><strong>架構要素</strong> ：
<ul>
<li><img class="emoji" draggable="false" alt="🗂️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f5c2.svg" data-marp-twemoji=""/> <strong>分欄分類</strong> ：依產品線或服務類型分欄，搭配圖示與簡短副標。</li>
<li><img class="emoji" draggable="false" alt="🌟" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f31f.svg" data-marp-twemoji=""/> <strong>特色推薦</strong> ：在選單右側嵌入精選產品圖卡或行銷 Banner。</li>
<li><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a1.svg" data-marp-twemoji=""/> <strong>視覺階層</strong> ：粗體主類別 + 易讀子連結，讓視線一秒掃描全貌。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%92%A1-%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95%E8%88%87%E9%81%A9%E7%94%A8%E6%83%85%E5%A2%83-4"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 設計心法與適用情境</h3>
<ul>
<li><strong>經典範例</strong> ：大型電商 (Amazon, ASOS)、企業雲端官網 (Microsoft, AWS)。</li>
<li><strong>核心價值</strong> ：將 3 層點擊縮短為 1 次懸停，降低架構迷航率。</li>
</ul>
</div>

<h2 id="tw311-%E9%BA%B5%E5%8C%85%E5%B1%91%E8%A8%98%E8%99%9F-breadcrumbs">TW3.11 麵包屑記號 (Breadcrumbs)</h2>
<div class="two-columns-64">
<div class="card">
<h3 id="%E6%B8%85%E6%A5%9A%E6%A8%99%E7%A4%BA%E8%BA%AB%E5%9C%A8%E4%BD%95%E8%99%95%E7%9A%84%E9%9A%8E%E5%B1%A4%E8%B7%AF%E6%A8%99">清楚標示「身在何處」的階層路標</h3>
<ul>
<li><strong>模式本質</strong> ：以水平文字鏈展示當前頁面在網站樹狀階層中的相對位置。</li>
<li><strong>路徑格式</strong> ：<code>首頁 &gt; 3C 數位 &gt; 耳機音響 &gt; 無線降噪耳機</code></li>
<li><strong>設計規範</strong> ：
<ul>
<li>末端項目為當前頁面（不設超連結並加粗顯示）。</li>
<li>每個父層級均可點擊，方便使用者一鍵回溯至上一層或根節點。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%92%A1-%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95%E8%88%87%E9%81%A9%E7%94%A8%E6%83%85%E5%A2%83-5"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 設計心法與適用情境</h3>
<ul>
<li><strong>經典範例</strong> ：深層電商商品頁、大型知識庫與說明文件。</li>
<li><strong>核心價值</strong> ：增強空間認知與安全感，大幅降低跳出率。</li>
</ul>
</div>
</div>

<header>Tidwell Interaction Design Patterns</header>
<h2 id="chapter-4-%E7%B6%B2%E9%A0%81%E5%85%83%E7%B4%A0%E7%9A%84%E6%8E%92%E7%89%88-layout">Chapter 4: 網頁元素的排版 (Layout)</h2>
<div class="two-columns">
<div class="card">
<h3 id="%E6%8E%92%E7%89%88%E6%A8%A1%E5%BC%8F%E6%B8%85%E5%96%AE">排版模式清單</h3>
<ul>
<li><strong>TW4.1 視覺框架 (Visual Framework)</strong></li>
<li><strong>TW4.2 中央舞台 (Center Stage)</strong></li>
<li><strong>TW4.3 同質性網格 (Grid of Equals)</strong></li>
<li><strong>TW4.4 標題分區 (Titled Sections)</strong></li>
<li><strong>TW4.5 模組化分頁 (Module Tabs)</strong></li>
<li><strong>TW4.6 手風琴模式 (Accordion)</strong></li>
<li><strong>TW4.7 可折疊面板 (Collapsible Panels)</strong></li>
<li><strong>TW4.8 可移動面板 (Movable Panels)</strong></li>
</ul>
</div>
<div class="card">
<h3 id="%E6%A0%B8%E5%BF%83%E5%8E%9F%E5%89%87">核心原則</h3>
<ul>
<li><strong>階層分明</strong> ：利用標題、格線與負空間明確劃分資訊權重。</li>
<li><strong>節省空間</strong> ：在有限視窗內，利用 Tab 分頁與手風琴摺疊隱藏次要內容。</li>
<li><strong>直覺對齊</strong> ：保持網格對齊，消除視覺混亂。</li>
</ul>
</div>
</div>

</section>

<header>Tidwell Interaction Design Patterns</header>
<h2 id="tw45-%E6%A8%A1%E7%B5%84%E5%8C%96%E5%88%86%E9%A0%81-module-tabs">TW4.5 模組化分頁 (Module Tabs)</h2>
<div class="two-columns-64">
<div class="card">
<h3 id="%E5%9C%A8%E6%9C%89%E9%99%90%E7%A9%BA%E9%96%93%E5%88%87%E6%8F%9B%E5%90%8C%E4%B8%80%E5%AE%B9%E5%99%A8%E7%9A%84%E5%85%A7%E5%AE%B9%E6%A8%A1%E7%B5%84">在有限空間切換同一容器的內容模組</h3>
<ul>
<li><strong>模式本質</strong> ：將同一卡片或容器內的多組關聯資料，透過頂部分頁標籤進行切換顯示。</li>
<li><strong>互動設計重點</strong> ：
<ul>
<li><strong>當前狀態明顯</strong> ：以底線、背景色反差或顏色高亮標記目前作用中的分頁。</li>
<li><strong>即時載入</strong> ：切換時無需重新整理整個網頁，保持流暢體驗。</li>
<li><strong>資訊計數</strong> ：分頁標籤可附帶數字徽章（如 <code>錯誤 (3)</code>、<code>待審核 (12)</code>）。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%92%A1-%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95%E8%88%87%E9%81%A9%E7%94%A8%E6%83%85%E5%A2%83-6"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 設計心法與適用情境</h3>
<ul>
<li><strong>經典範例</strong> ：開發者控制台、產品規格/評價頁籤、個人檔案設定。</li>
<li><strong>核心價值</strong> ：極致利用垂直空間，維持頁面視覺清爽（NS08）。</li>
</ul>
</div>
</div>

<h2 id="tw46-%E6%89%8B%E9%A2%A8%E7%90%B4%E6%A8%A1%E5%BC%8F-accordion">TW4.6 手風琴模式 (Accordion)</h2>
<div class="two-columns-64">
<div class="card">
<h3 id="%E5%9E%82%E7%9B%B4%E5%A0%86%E7%96%8A%E8%88%87%E6%8C%89%E9%9C%80%E5%B1%95%E9%96%8B%E7%9A%84%E6%8A%98%E7%96%8A%E6%B8%85%E5%96%AE">垂直堆疊與按需展開的折疊清單</h3>
<ul>
<li><strong>模式本質</strong> ：垂直排列的標題面板，點擊可向下展開詳細內容；展開新項目時可選擇自動收合其餘項目。</li>
<li><strong>關鍵視覺要素</strong> ：
<ul>
<li>右側提供明確的展開/收合狀態圖示（<code>+ / −</code> 或 <code>⌵ / ⌃</code>）。</li>
<li>平滑的高度過渡動畫，避免畫面突兀跳動。</li>
<li>適合內容長短不一、使用者僅需挑選特定項目閱讀的情境。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%92%A1-%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95%E8%88%87%E9%81%A9%E7%94%A8%E6%83%85%E5%A2%83-7"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 設計心法與適用情境</h3>
<ul>
<li><strong>經典範例</strong> ：常見問答 (FAQ)、多步驟購物結帳表單、行動端篩選器。</li>
<li><strong>核心價值</strong> ：漸進式揭露資訊，避免超長頁面造成滾動疲勞。</li>
</ul>
</div>
</div>

<div class="two-columns-64">
<div class="card">
<h3 id="%E5%BD%88%E6%80%A7%E4%BC%B8%E7%B8%AE%E7%9A%84%E5%B0%88%E6%A5%AD%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%81%B4%E9%82%8A%E6%AC%84">彈性伸縮的專業工作區側邊欄</h3>
<ul>
<li><strong>模式本質</strong> ：將輔助功能（如檔案樹、屬性檢查器、AI 助理）置於可折疊收納的側邊欄。</li>
<li><strong>核心機制</strong> ：
<ul>
<li><img class="emoji" draggable="false" alt="👈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f448.svg" data-marp-twemoji=""/> <strong>一鍵收折</strong> ：點擊側欄切換按鈕或邊界圖示，側欄滑入/收合為緊湊圖示列。</li>
<li><img class="emoji" draggable="false" alt="↔️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2194.svg" data-marp-twemoji=""/> <strong>邊界拖曳</strong> ：支援拖曳邊界自訂寬度，適應不同螢幕大小。</li>
<li><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4bb.svg" data-marp-twemoji=""/> <strong>聚焦畫布</strong> ：需要專注時收合兩側面板，最大化中央主要工作舞台。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%92%A1-%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95%E8%88%87%E9%81%A9%E7%94%A8%E6%83%85%E5%A2%83-8"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 設計心法與適用情境</h3>
<ul>
<li><strong>經典範例</strong> ：VS Code / Cursor 編輯器、Figma 設計介面、Notion 側邊導航。</li>
<li><strong>核心價值</strong> ：兼顧工具完整度與主要任務專注度（NS07, NS08）。</li>
</ul>
</div>

<header>Tidwell Interaction Design Patterns</header>
<h2 id="%E6%B8%85%E5%96%AE%E6%A8%A1%E5%BC%8F%E5%B0%8D%E6%AF%94%E9%9B%99%E9%9D%A2%E6%9D%BF-vs-%E5%8D%A1%E7%89%87-vs-%E5%B5%8C%E6%9D%BF">清單模式對比：雙面板 vs 卡片 vs 嵌板</h2>
<div class="three-columns">
<div class="card">
<h3 id="tw71-%E9%9B%99%E9%9D%A2%E6%9D%BF%E9%81%B8%E6%93%87%E5%99%A8">TW7.1 雙面板選擇器</h3>
<ul>
<li>左側為項目清單，右側為詳細內容。</li>
<li>適合寬螢幕桌面端 (如 Email 客戶端、檔案管理器)。</li>
</ul>
</div>
<div class="card">
<h3 id="tw74-%E5%8D%A1%E7%89%87-cards">TW7.4 卡片 (Cards)</h3>
<ul>
<li>將圖文、標籤與操作封裝在獨立矩形卡片中。</li>
<li>響應式佈局極佳，適合手機與跨裝置呈現。</li>
</ul>
</div>
<div class="card">
<h3 id="tw73-%E6%B8%85%E5%96%AE%E5%B5%8C%E6%9D%BF-list-inlay">TW7.3 清單嵌板 (List Inlay)</h3>
<ul>
<li>點擊清單項目後，在原地向下展開詳細資訊。</li>
<li>無需跳轉頁面，保持上下文連貫。</li>
</ul>
</div>
</div>

<h2 id="tw73-%E6%B8%85%E5%96%AE%E5%B5%8C%E6%9D%BF-list-inlay-1">TW7.3 清單嵌板 (List Inlay)</h2>
<div class="two-columns-64">
<div class="card">
<h3 id="%E6%B8%85%E5%96%AE%E9%A0%85%E7%9B%AE%E5%8E%9F%E5%9C%B0%E4%B8%8B%E6%8B%89%E5%B1%95%E9%96%8B%E7%9A%84%E4%B8%8A%E4%B8%8B%E6%96%87%E5%BB%B6%E7%BA%8C">清單項目原地下拉展開的上下文延續</h3>
<ul>
<li><strong>模式本質</strong> ：點擊清單中的某一列時，直接在該列下方原地「嵌入展開」詳細資訊區塊。</li>
<li><strong>設計優勢</strong> ：
<ul>
<li><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f6ab.svg" data-marp-twemoji=""/> <strong>無需跳轉頁面</strong> ：完全避免進入新頁面再按返回的繁瑣流程。</li>
<li><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f9ed.svg" data-marp-twemoji=""/> <strong>保持上下文</strong> ：展開時使用者依然能看到清單前後的相鄰項目。</li>
<li><img class="emoji" draggable="false" alt="📈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4c8.svg" data-marp-twemoji=""/> <strong>階層式詳情</strong> ：適合呈現時間軸軌跡、配送站點、訂單明細。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%92%A1-%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95%E8%88%87%E9%81%A9%E7%94%A8%E6%83%85%E5%A2%83-9"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 設計心法與適用情境</h3>
<ul>
<li><strong>經典範例</strong> ：Google Maps 路線轉乘詳情、物流行程追蹤、銀行交易明細。</li>
<li><strong>核心價值</strong> ：保持空間記憶與任務連貫性，大幅提升瀏覽效率。</li>
</ul>
</div>
</div>

<header>Tidwell Interaction Design Patterns</header>
<h2 id="tw74-%E5%8D%A1%E7%89%87%E5%8C%96%E8%A8%AD%E8%A8%88-cards">TW7.4 卡片化設計 (Cards)</h2>
<div class="two-columns-64">
<div class="card">
<h3 id="%E7%95%B0%E8%B3%AA%E8%B3%87%E8%A8%8A%E7%9A%84%E7%8D%A8%E7%AB%8B%E6%A8%A1%E7%B5%84%E5%8C%96%E5%B0%81%E8%A3%9D">異質資訊的獨立模組化封裝</h3>
<ul>
<li><strong>模式本質</strong> ：將圖片、標題、標籤、摘要、作者資訊與操作按鈕封裝在獨立的矩形卡片中。</li>
<li><strong>設計要素</strong> ：
<ul>
<li><img class="emoji" draggable="false" alt="🖼️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f5bc.svg" data-marp-twemoji=""/> <strong>視覺錨點</strong> ：頂部特色封面圖吸引第一眼注意力。</li>
<li><img class="emoji" draggable="false" alt="🏷️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3f7.svg" data-marp-twemoji=""/> <strong>分類晶片 (Chips)</strong> ：彩色標籤標示類別與狀態。</li>
<li><img class="emoji" draggable="false" alt="🖱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f5b1.svg" data-marp-twemoji=""/> <strong>清晰邊界與懸浮反饋</strong> ：卡片具備微陰影與 Hover 浮起動效，暗示可點擊性。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%92%A1-%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95%E8%88%87%E9%81%A9%E7%94%A8%E6%83%85%E5%A2%83-10"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 設計心法與適用情境</h3>
<ul>
<li><strong>經典範例</strong> ：社群動態 (Pinterest)、文章列表 (Medium)、儀表板小工具。</li>
<li><strong>核心價值</strong> ：極佳的響應式適配能力，在手機與電腦間無縫重排。</li>
</ul>

<header>Tidwell Interaction Design Patterns</header>
<h2 id="tw76-%E6%97%8B%E8%BD%89%E6%9C%A8%E9%A6%AC--%E8%BC%AA%E6%92%AD-carousel">TW7.6 旋轉木馬 / 輪播 (Carousel)</h2>
<div class="two-columns-64">
<div class="card">
<h3 id="%E6%A9%AB%E5%90%91%E6%BB%91%E5%8B%95%E7%9A%84%E5%A4%9A%E9%A0%85%E7%9B%AE%E6%8E%A2%E7%B4%A2%E5%B1%95%E7%A4%BA">橫向滑動的多項目探索展示</h3>
<ul>
<li><strong>模式本質</strong> ：在固定寬度區域內，以橫向排列卡片或橫幅，支援左右滑動切換。</li>
<li><strong>必備互動指引</strong> ：
<ul>
<li>左右兩側提供清晰的箭頭切換按鈕。</li>
<li>底部提供當前頁數指示圓點（Pagination Dots）。</li>
<li>兩側邊緣卡片「稍微露出一角（Peek-a-boo）」，視覺暗示右側還有更多內容。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%92%A1-%E8%A8%AD%E8%A8%88%E5%BF%83%E6%B3%95%E8%88%87%E9%81%A9%E7%94%A8%E6%83%85%E5%A2%83-11"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 設計心法與適用情境</h3>
<ul>
<li><strong>經典範例</strong> ：Netflix 影集分類推薦、App Store 精選輪播、課程平台熱門推薦。</li>
<li><strong>核心價值</strong> ：在有限第一屏展示多個推薦項目，引導手勢橫向探索。</li>
</ul>
</div>
